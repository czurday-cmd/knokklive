<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E56B8">
<title>NOKK 시험 v2</title>
<!-- R84-3 B · B30(v4.7.8-r79v3b) 시험 페이지 v2 · 한 파일 · 바깥 라이브러리 · 글꼴 없음 · 원래 nokk_live.html 은 그대로 -->
<style>
  :root{--blue:#1E56B8;--orange:#B4470F;--black:#1A1C1E;--gray:#6B7280;--line:#D0D4DA;--bg:#F2F3F5;--card:#FFFFFF;--text:#1A1C1E;--dim:#5B6270;--purple:#6B21A8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
  body{padding-bottom:76px}
  button{font:inherit;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;cursor:pointer}
  button:active{opacity:.75}
  .pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .sec{border-color:var(--blue);color:var(--blue)}
  .sm{min-height:44px;padding:6px 12px;font-size:14px}
  #bar{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:8px 10px 6px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-block;font-size:13px;padding:3px 8px;border-radius:12px;border:1.5px solid var(--line);color:var(--dim);white-space:nowrap}
  .pon{border-color:var(--blue);color:var(--blue);font-weight:700}
  .poff{border-color:var(--gray);color:var(--gray)}
  .pwait,.pwarn{border-color:var(--orange);color:var(--orange);font-weight:700}
  .small{font-size:13px;color:var(--dim)}
  #btnConn{min-height:36px;padding:4px 12px;font-size:14px}
  #btnNow,#btnStop{min-height:36px;padding:4px 10px;font-size:13px}
  #btnStop{border-color:var(--orange);color:var(--orange)}
  main{padding:10px}
  .card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;border:1px solid var(--line)}
  .live .lr{display:grid;grid-template-columns:76px 1fr 72px;gap:8px;align-items:center;margin:4px 0}
  .live .lab{font-size:13px;color:var(--dim)}
  .live .val{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
  .meter{position:relative;height:16px;background:#E6E8EC;border-radius:8px;overflow:hidden}
  .meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:8px}
  .meter.d>i{background:var(--orange)} .meter.a>i{background:var(--purple)}
  .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--black)}
  .tick span{position:absolute;top:-1px;right:4px;font-size:10px;color:var(--black);white-space:nowrap}
  #btnMiss{width:100%;min-height:64px;background:var(--black);border-color:var(--black);color:#fff;font-size:20px;font-weight:800;border-radius:14px}
  #missLine{margin:4px 2px 10px}
  h2{font-size:16px;margin:12px 2px 6px}
  h3{font-size:15px;margin:14px 0 6px}
  .ev{display:grid;grid-template-columns:70px 1fr;grid-template-rows:auto auto auto;gap:2px 8px;width:100%;text-align:left;margin-bottom:6px;border-left-width:6px}
  .ev .evt{grid-row:1/4;font-weight:800;font-variant-numeric:tabular-nums}
  .ev .evk{font-weight:700} .ev .evr{font-size:13px;color:var(--dim)} .ev .evs{font-size:13px}
  .jnone{border-left-color:var(--line)} .jtp{border-left-color:var(--blue)} .jfp1{border-left-color:var(--orange)} .jfp2{border-left-color:var(--orange);border-left-style:dashed} .junk{border-left-color:var(--gray)}
  .tag{font-style:normal;font-size:12px;border:1px solid var(--orange);color:var(--orange);border-radius:8px;padding:0 5px}
  .muted{color:var(--dim);text-align:center;padding:10px 0;font-size:14px}
  .kv{font-size:14px;margin:6px 0;line-height:1.45}
  .expl{white-space:pre-wrap;font-size:13px}
  nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav#tabs button{border:0;border-radius:0;min-height:60px;background:transparent;font-weight:700;color:var(--dim)}
  nav#tabs button.on{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .2s;padding:12px 12px 24px}
  .sheet.open{transform:none}
  .shT{font-size:18px;font-weight:800}
  .graph{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}
  .jgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
  .jb{min-height:64px;font-weight:800;font-size:17px}
  .jb small{display:block;font-weight:400;font-size:12px}
  .jTP{border-color:var(--blue);color:var(--blue)} .jTP.on{background:var(--blue);color:#fff}
  .jFP1{border-color:var(--orange);color:var(--orange)} .jFP1.on{background:var(--orange);color:#fff}
  .jFP2{border-color:var(--orange);color:var(--orange);border-width:3px} .jFP2.on{background:#FBEAE2}
  .jUNK{border-color:var(--gray);color:var(--gray)} .jUNK.on{background:#E6E8EC}
  .chip{min-height:44px;margin:3px 4px 3px 0;border-radius:22px;font-size:14px}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .full{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;padding-bottom:30px}
  .full.open{display:block}
  .fhead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 10px}
  .fhead b{font-size:17px}
  textarea,input[type=text]{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
  table.bl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card)}
  table.bl td{border-bottom:1px solid var(--line);padding:5px 4px;vertical-align:top}
  table.bl td:nth-child(2){font-weight:800;white-space:nowrap}
  tr.st-b td:nth-child(2){color:var(--orange)} tr.st-p td:nth-child(2){color:var(--blue)} tr.st-u td:nth-child(2){color:var(--gray)}
  .src{display:block;color:var(--gray);font-size:11px}
  .rec{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;font-size:14px}
  .rangebar{position:relative;height:22px;background:#FBEAE2;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
  .rangebar i{position:absolute;top:0;bottom:0;background:var(--blue)}
  .tog{width:100%;text-align:left;margin:4px 0}
  .tog.on{border-color:var(--blue);color:var(--blue);font-weight:700}
  .log{white-space:pre-wrap;font-size:11px;color:var(--dim);max-height:240px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
  .err{color:var(--orange);font-size:14px;min-height:18px}
</style>
</head>
<body>
<header id="bar">
  <div class="row"><button id="btnConn">연결</button><span id="stConn" class="pill poff">끊김</span><span id="stMic" class="pill">마이크 ?</span><span id="stBoot" class="pill">boot ?</span>
    <button id="btnNow" class="sec">지금부터 받기</button><button id="btnStop" style="display:none">그만 받기</button></div>
  <div class="row" style="margin-top:4px"><span id="stLive" class="pill">—</span><span id="stData" class="small">자료 없음</span><span id="stRange" class="small"></span></div>
</header>
<main>
  <section id="tab-events">
    <div class="card live">
      <div class="lr"><span class="lab">경적 h</span><div class="meter"><i id="lvHbar" style="width:0"></i><b class="tick" style="left:92%"><span>0.92</span></b></div><span class="val" id="lvH">–</span></div>
      <div class="lr" id="lvArow" style="display:none"><span class="lab">경보음 p</span><div class="meter a"><i id="lvAbar" style="width:0"></i><b class="tick" style="left:90%"><span>0.90</span></b></div><span class="val" id="lvA">–</span></div>
      <div class="lr"><span class="lab">크기</span><div class="meter d"><i id="lvDbar" style="width:0"></i><b class="tick" style="left:65.7%"><span>76</span></b></div><span class="val" id="lvD">–</span></div>
    </div>
    <button id="btnMiss">놓침 신고</button>
    <div id="missLine" class="small">오늘 놓침 0</div>
    <h2>판정 안 한 울림 <span id="unjN">0</span></h2>
    <div id="evUnj"><div class="muted">판정 안 한 울림 없음</div></div>
    <h2>판정한 울림 · 최근 5</h2>
    <div id="evJ"><div class="muted">아직 없음</div></div>
    <button id="btnAllJ" class="sec" style="display:none;width:100%">모두 보기</button>
  </section>
  <section id="tab-recs" style="display:none">
    <div class="card"><button id="btnRec" class="pri" style="width:100%">지금 10초 받기</button>
      <div id="recProg" class="small" style="margin-top:6px"></div><div id="recSlots" class="small"></div><div id="recErr" class="err"></div></div>
    <audio id="player" controls style="width:100%;display:none"></audio>
    <div class="card" id="recList"><div class="muted">녹음 없음</div></div>
  </section>
  <section id="tab-log" style="display:none">
    <div class="card"><div class="small">오늘 받은 범위(파랑 = 받음 · 주황 = 빈 곳 · 00시 ~ 24시)</div><div id="logBar" class="rangebar"></div>
      <div id="logCounts" class="kv"></div><div id="logStore" class="small"></div></div>
    <div class="card"><div class="small">시각 찾기(HHMMSS 숫자 6 개 · 콜론 넣어도 됨 · 오늘)</div><div class="row"><input type="text" id="findTime" inputmode="numeric" placeholder="예: 143205" style="flex:1"><button id="btnFind" class="pri">찾기</button></div><div id="findErr" class="err"></div></div>
    <div class="card"><button id="btnExp" class="pri" style="width:100%">오늘 것 내보내기(zip)</button><div id="expMsg" class="small" style="margin-top:6px"></div>
      <button id="btnDelExp" class="sec" style="width:100%;margin-top:8px">내보낸 것 폰에서 지우기</button></div>
  </section>
  <section id="tab-set" style="display:none"><div class="card" id="setBody"></div></section>
</main>
<nav id="tabs"><button id="tb-events" class="on">울림</button><button id="tb-recs">녹음</button><button id="tb-log">기록</button><button id="tb-set">설정</button></nav>
<div id="sheet" class="sheet">
  <div class="row" style="justify-content:space-between"><b>판정</b><button id="shClose" class="sm">닫기</button></div>
  <div id="shHead"></div>
  <canvas id="shCanvas" width="680" height="240" class="graph"></canvas>
  <div id="shMain" class="jgrid"></div>
  <div id="shSub"></div>
  <label class="kv" style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="shCar" style="width:24px;height:24px"> 차 안이었음</label>
  <textarea id="shMemo" rows="2" placeholder="메모(선택)"></textarea>
  <div id="shErr" class="err"></div>
  <button id="shSave" class="pri" style="width:100%;min-height:52px">저장</button>
  <div id="shHist" class="small" style="margin-top:6px"></div>
</div>
<div id="missPage" class="full">
  <div class="fhead"><button id="missBack" class="sm">뒤로</button><b>놓침 신고</b></div>
  <main>
    <div id="missRec" class="kv"></div>
    <h3>언제</h3><div id="missWhen"></div>
    <div id="missTimeRow" style="display:none"><input type="text" id="missTime" inputmode="numeric" placeholder="HHMMSS(예: 143205) · 날짜 = 오늘"><div id="missErr" class="err"></div></div>
    <h3>무슨 소리</h3><div id="missSound"></div>
    <h3>거리</h3><div id="missDist"></div>
    <h3>장소</h3><div id="missPlace"></div>
    <h3>진짜 상황 · 시험</h3><div id="missReal"></div>
    <h3>메모</h3><textarea id="missMemo" rows="2"></textarea>
    <button id="missSave" class="pri" style="width:100%;min-height:52px;margin-top:10px">저장 → 시각 확인</button>
  </main>
</div>
<div id="tcPage" class="full">
  <div class="fhead"><button id="tcBack" class="sm">뒤로</button><b id="tcTitle">시각 확인</b></div>
  <main id="tcBody"></main>
</div>
<script id="nokk-core">

  $("missRec").textContent = "녹음: " + (d.recState || "") + " · 누른 시각 " + N.hms(d.press);
}
function renderLog() {
  const el = $("logBar"); if (!el) return; const day = N.dayOf(now());
  const R = S.ranges.filter((r) => N.dayOf(r[0]) === day); const d0 = new Date(); d0.setHours(0, 0, 0, 0); const t0 = d0.getTime();
  el.innerHTML = R.map((r) => '<i style="left:' + ((r[0] - t0) / 864e5 * 100).toFixed(3) + "%;width:" + Math.max(0.2, (r[1] - r[0]) / 864e5 * 100).toFixed(3) + '%"></i>').join("");
  const ev = Array.from(S.events.values()).filter((e) => e.day === day);
  $("logCounts").textContent = "오늘 울림 " + ev.length + " · 판정 " + ev.filter((e) => e.judge).length + " · 놓침 " + S.misses.filter((m) => m.day === day).length + " · 녹음 " + Array.from(S.recs.values()).filter((m) => m.state === "받음" && m.day === day).length + " · 빈 곳 " + S.gaps.filter((g) => g.day === day).length;
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then((e) => { $("logStore").textContent = "저장량 " + (e.usage / 1048576).toFixed(1) + " MB / " + (e.quota / 1048576 / 1024).toFixed(1) + " GB"; }).catch(() => {});
}
function renderSettings() {
  const el = $("setBody"); if (!el) return; const st = S.stat, st2 = S.st2, v = S.ver;
  const tg = (k, label) => '<button class="tog' + (S.settings[k] ? " on" : "") + '" data-set="' + k + '">' + esc(label) + " · " + (S.settings[k] ? "켜짐" : "꺼짐") + "</button>";
  el.innerHTML = tg("tester", "시험자 모드(기기에 저장 · tester on/off)") + '<div class="small">기기 상태(ST2): ' + (st2 ? (st2.tester ? "시험자 모드 켜짐" : "꺼짐") + " · 녹음 칸 " + st2.rec + "/2" : "모름") + "</div>" +
    tg("autoRec", "녹음 자동 받기") + tg("timeSync", "기기 시각 맞추기(연결 때 time)") + tg("wake", "화면 켜 두기") +
    '<button class="sec" id="btnDisc">연결 끊기(live off)</button>' +
    '<div class="kv"><b>기기 판</b> ' + esc(v ? v.fw + " · " + v.date + " · proto " + v.proto : "모름") + "</div>" +
    '<div class="kv"><b>기기 모드(보기만)</b> ' + esc(st ? "mode " + st.mode + " · mask 0x" + (st.mask !== null ? st.mask.toString(16).toUpperCase() : "?") + " · 민감도 " + st.sens + " · 켜진 지 " + st.up + " s · 원장 " + st.led : "모름") + "</div>" +
    '<div class="kv"><b>페이지 판</b> ' + esc(C.PAGE_VER) + "</div><pre id=\"cmdlog\" class=\"log\"></pre>";
  $("btnDisc").onclick = disconnect; $("cmdlog").textContent = S.log.slice(0, 30).join("\n");
}
function renderAll() { renderStatus(); renderEvents(); renderRecs(); renderLog(); renderSettings(); }
setInterval(() => { renderStatus(); }, 500);
setInterval(() => { renderLog(); }, 5000);
/* ---------- 큰 판 · 탭 ---------- */
function openFull(id) { $(id).classList.add("open"); }
function closeFull(id) { $(id).classList.remove("open"); }
function tab(name) { for (const t of ["events", "recs", "log", "set"]) { $("tab-" + t).style.display = t === name ? "" : "none"; $("tb-" + t).classList.toggle("on", t === name); } if (name === "log") renderLog(); if (name === "set") renderSettings(); if (name === "recs") renderRecs(); }
/* ---------- 내보내기(B10 · zip 저장 방식) ---------- */
async function exportToday() {
  await dbFlush(); const day = N.dayOf(now());
  const sr = (await dbAll("srec", "day", IDBKeyRange.only(day))).sort((a, b) => a.rx - b.rx || a.seq - b.seq);
  const ln = (await dbAll("lines", "day", IDBKeyRange.only(day))).sort((a, b) => a.rx - b.rx);
  const recs = (await dbAll("recs", "day", IDBKeyRange.only(day))).filter((m) => m.state === "받음");
  const files = [];
  files.push({ name: "nokk_" + day + "_records.txt", data: enc.encode(sr.map((x) => "S|" + x.seq + "|" + x.boot + "|" + x.ms + "|" + x.b64).join("\n") + (sr.length ? "\n" : "")) });   // nokk_live.html:272 과 같은 S| 줄 꼴
  files.push({ name: "nokk_" + day + "_events.txt", data: enc.encode(ln.map((x) => N.hmsms(x.rx) + "\t" + x.line).join("\n") + (ln.length ? "\n" : "")) });
  const head = ["종류", "기기 시각", "boot", "slice", "축", "등급", "h", "p_alarm", "dBA", "L", "판정", "세부", "차 안", "메모", "소리", "거리", "장소", "진짜/시험", "녹음 파일", "고친 횟수", "저장 시각"];
  const rows = [N.csvRow(head)];
  for (const e of Array.from(S.events.values()).filter((e) => e.day === day).sort((a, b) => (a.t || 0) - (b.t || 0))) {
    const r = e.rec ? S.recs.get(e.rec) : null;
    rows.push(N.csvRow(["울림" + (e.gap ? "(끊겨 있던 동안)" : ""), e.t ? N.hmsms(e.t) : "", e.boot, e.slice, C.KIND_NAME[e.kind] || e.kind, e.grade || "", e.h, e.alarm, e.dBA, e.L, e.judge ? JUDGE[e.judge.main] : "", e.judge ? e.judge.sub.join("/") : "", e.judge && e.judge.car ? "예" : "", e.judge ? e.judge.memo : "", "", "", "", "", r && r.state === "받음" ? r.file : "", (e.hist || []).length, e.judge ? N.hmsms(e.judge.savedAt) : ""]));
  }
  for (const m of S.misses.filter((m) => m.day === day)) {
    const r = m.rec ? S.recs.get(m.rec) : null;
    rows.push(N.csvRow(["놓침", N.hmsms(m.t), "", "", "", "", "", "", "", "", "", "", "", m.memo, m.sound, m.dist, m.place, m.real, r && r.state === "받음" ? r.file : (m.recState || ""), (m.hist || []).length, m.savedAt ? N.hmsms(m.savedAt) : ""]));
  }
  files.push({ name: "nokk_" + day + "_labels.csv", data: enc.encode("﻿" + rows.join("\r\n") + "\r\n") });
  for (const m of recs) {
    const w = await dbGet("recwav", m.k); if (!w) continue;
    const buf = new Uint8Array(await w.wav.arrayBuffer());
    files.push({ name: "rec_" + m.boot + "_" + m.id + ".wav", data: buf }); files.push({ name: "rec_" + m.boot + "_" + m.id + ".json", data: enc.encode(JSON.stringify(m.meta || {}, null, 1)) });
  }
  const zip = N.zipStore(files, now()); const blob = new Blob([zip], { type: "application/zip" });
  S.exportBlob = blob; S.lastExport = { day: day, at: now(), files: files.map((f) => f.name), srec: sr.map((x) => x.k), lines: ln.length, recs: recs.map((m) => m.k) };
  metaSet("exported:" + day, { at: now(), srec: sr.length, lines: ln.length, recs: recs.length });
  for (const x of sr) { x.exp = 1; dbPut("srec", x); } for (const x of ln) { x.exp = 1; dbPut("lines", x); } for (const m of recs) { m.exp = 1; dbPut("recs", m); S.recs.set(m.k, m); }
  dbFlush();
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "nokk_" + day + ".zip"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  $("expMsg").textContent = "내보냄 " + N.hms(now()) + " · 파일 " + files.length + " · S| " + sr.length + " 줄 · 원문 " + ln.length + " 줄 · 녹음 " + recs.length;
}
async function deleteExported() {   // 내보낸 것만(exp = 1) — 판정 · 놓침 · 울림 목록은 남김
  await dbFlush(); const all = await dbAll("srec"); const del = all.filter((x) => x.exp).map((x) => x.k); await dbDel("srec", del);
  const ln = await new Promise((res) => { const out = []; const r = DB.db.transaction(["lines"], "readonly").objectStore("lines").openCursor(); r.onsuccess = () => { const c = r.result; if (c) { if (c.value.exp) out.push(c.primaryKey); c.continue(); } else res(out); }; r.onerror = () => res(out); });
  await dbDel("lines", ln);
  const rs = (await dbAll("recs")).filter((m) => m.exp); await dbDel("recwav", rs.map((m) => m.k)); for (const m of rs) { m.state = "내보내고 폰에서 지움"; dbPut("recs", m); S.recs.set(m.k, m); }
  dbFlush(); $("expMsg").textContent = "지움: S| " + del.length + " 줄 · 원문 " + ln.length + " 줄 · 녹음 " + rs.length + "(내보내지 않은 것은 그대로)"; renderAll();
}
/* ---------- 화면 켜 두기 ---------- */
async function wakeOn() { if (!S.settings.wake) return; try { if ("wakeLock" in navigator && !S.wake) { S.wake = await navigator.wakeLock.request("screen"); S.wake.addEventListener("release", () => { S.wake = null; }); } } catch (e) {} }
function wakeOff() { if (S.wake) { S.wake.release().catch(() => {}); S.wake = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { if (S.wantConn && (!S.dev || !S.dev.gatt.connected)) retry(); if (S.wantConn) wakeOn(); } });
/* ---------- 재생 ---------- */
async function play(k) { const w = await dbGet("recwav", k); if (!w) return; const a = $("player"); a.src = URL.createObjectURL(w.wav); a.style.display = ""; a.play().catch(() => {}); }
/* ---------- 손 · 단추 ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-k]"); if (!t) return;
  if (t.dataset.k) { openSheet(t.dataset.k); return; }
  if (t.dataset.play) { play(t.dataset.play); return; }
  if (t.dataset.get) { const m = S.recs.get(t.dataset.get); if (m) recFetch(m); return; }
  if (t.dataset.main) { S.judge.main = t.dataset.main; S.judge.sub = []; renderSheet(); return; }
  if (t.dataset.sub) { const i = S.judge.sub.indexOf(t.dataset.sub); if (i >= 0) S.judge.sub.splice(i, 1); else S.judge.sub.push(t.dataset.sub); renderSheet(); return; }
  if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = !S.settings[k]; metaSet("settings", S.settings);
    if (k === "tester" && S.tx) cmd("tester " + (S.settings.tester ? "on" : "off"), { expect: (l) => /^(OK|ERR)\|tester/.test(l), timeout: 3000 }).then(() => cmd("stat", { expect: (l) => l.startsWith("ST2|"), timeout: 3000 }));
    if (k === "wake") { if (S.settings.wake) wakeOn(); else wakeOff(); }
    renderSettings(); return; }
  const d = S.missDraft; for (const f of ["when", "sound", "dist", "place", "real"]) if (t.dataset[f] !== undefined && d) { d[f] = t.dataset[f]; renderMiss(); return; }
});
function wire() {
  $("btnConn").onclick = () => { if (!(S.dev && S.wantConn)) connect(); };
  $("btnNow").onclick = async () => { if (S.tx && !S.batch) { await liveNow(); note("지금부터 받기"); } };
  $("btnMiss").onclick = missStart; $("missSave").onclick = missSave; $("missBack").onclick = () => closeFull("missPage");
  $("tcBack").onclick = () => closeFull("tcPage"); $("shClose").onclick = () => { $("sheet").classList.remove("open"); S.sheetKey = null; }; $("shSave").onclick = saveJudge;
  $("btnAllJ").onclick = () => { S.showAllJudged = !S.showAllJudged; renderEvents(); };
  $("btnRec").onclick = recNow; $("btnExp").onclick = exportToday; $("btnDelExp").onclick = deleteExported;
  $("btnFind").onclick = () => { const t = N.parseHHMMSS($("findTime").value); if (t !== null) openTimeCheck(t); else $("findErr").textContent = "숫자 6 개(HHMMSS) 또는 HH:MM:SS"; };
  $("btnStop").onclick = () => { if (S.batch) S.batch.stop = true; };
  for (const t of ["events", "recs", "log", "set"]) $("tb-" + t).onclick = () => tab(t);
}
/* ---------- 시작 ---------- */
async function boot() {
  wire(); tab("events");
  try { await dbOpen(); } catch (e) { note("IndexedDB 못 엶 " + e.message); renderAll(); return; }
  const meta = await dbAll("meta"); for (const m of meta) S.meta[m.key] = m.value; if (S.meta.settings) Object.assign(S.settings, S.meta.settings);
  for (const e of await dbAll("events")) S.events.set(e.k, e);
  S.misses = await dbAll("misses"); for (const r of await dbAll("recs")) S.recs.set(r.k, r);
  for (const c of await dbAll("clock")) S.clock.set(c.boot, c);
  S.gaps = await dbAll("gaps"); S.marks = await dbAll("marks");
  S.ranges = (S.meta["ranges:" + N.dayOf(now())] || []).slice();
  renderAll();
}
window.addEventListener("load", boot);
window.addEventListener("pagehide", () => { if (S.meta.lastRx) metaSet("lastRx", S.meta.lastRx); dbFlush(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { if (S.meta.lastRx) metaSet("lastRx", S.meta.lastRx); dbFlush(); } });
})();
